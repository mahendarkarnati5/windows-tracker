services:
  - type: web
    name: tracker-server
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TIDB_URL
        sync: false
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 86400000
      - key: DB_POOL_MAX_SIZE
        value: 10
      - key: DB_POOL_MIN_IDLE
        value: 1
      - key: AGENT_OFFLINE_AFTER_SECONDS
        value: 45
      - key: AGENT_PRESENCE_CHECK_MS
        value: 15000
