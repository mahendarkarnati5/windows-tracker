services:
  - type: web
    name: tracker-server
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TIDB_URL
        sync: false
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        sync: false
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: FLYWAY_ENABLED
        value: false
      - key: DB_POOL_MAX_SIZE
        value: 5
      - key: DB_POOL_MIN_IDLE
        value: 0
      - key: DB_INITIALIZATION_FAIL_TIMEOUT_MS
        value: -1
      - key: AGENT_DUPLICATE_REPAIR_ENABLED
        value: false
