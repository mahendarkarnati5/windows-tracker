spring.datasource.url=jdbc:h2:mem:tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
jwt.secret=test-secret-that-is-at-least-thirty-two-bytes-long
jwt.expiration=3600000
tracker.legacy-recovery.enabled=false
logging.level.root=WARN
spring.flyway.url=jdbc:h2:mem:tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.flyway.user=sa
spring.flyway.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
