spring.application.name=tracker-server

spring.datasource.url=${TIDB_URL}
spring.datasource.username=${TIDB_USER}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRE:86400000}

server.address=0.0.0.0
server.port=${PORT:10000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# The production database already has the V1-V4 schema. Heavy data-repair migrations must not
# block the web server from binding its Render port. Enable Flyway only for a brand-new database.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Do not perform schema validation or JDBC metadata discovery during web startup. This lets the
# HTTP server become healthy even while a cloud database is briefly cold or an old Render instance
# is still draining its pool during a zero-downtime deployment.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Small lazy pool: two overlapping Render instances cannot reserve every TiDB connection.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_FAIL_TIMEOUT_MS:-1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:300000}
spring.datasource.hikari.auto-commit=false

# Runtime reconciliation settings.
tracker.legacy-recovery.enabled=false
tracker.agent.offline-after-seconds=${AGENT_OFFLINE_AFTER_SECONDS:45}
tracker.agent.presence-check-ms=${AGENT_PRESENCE_CHECK_MS:15000}
tracker.agent.orphan-repair-ms=${AGENT_ORPHAN_REPAIR_MS:300000}
tracker.agent.presence-batch-size=${AGENT_PRESENCE_BATCH_SIZE:50}

# Never run full duplicate scans in live traffic. Agent UUID/revision upserts and natural-key
# projection lookups remain the authoritative duplicate prevention path.
tracker.agent.duplicate-repair-enabled=false
tracker.agent.duplicate-repair-ms=86400000
tracker.agent.duplicate-repair-initial-ms=86400000

tracker.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
tracker.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USERNAME:}
tracker.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
