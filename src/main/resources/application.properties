spring.application.name=tracker-server

spring.datasource.url=${TIDB_URL}
spring.datasource.username=${TIDB_USER}
spring.datasource.password=${TIDB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRE:86400000}

# 1. Tell Spring Boot to load your .env file safely
#spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}

# Flyway owns the schema. Hibernate verifies mappings but never mutates production.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
tracker.legacy-recovery.enabled=false
tracker.agent.offline-after-seconds=${AGENT_OFFLINE_AFTER_SECONDS:45}
tracker.agent.presence-check-ms=${AGENT_PRESENCE_CHECK_MS:10000}
tracker.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USERNAME:}
tracker.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
tracker.agent.orphan-repair-ms=${AGENT_ORPHAN_REPAIR_MS:60000}
