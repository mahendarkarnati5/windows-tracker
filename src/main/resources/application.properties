spring.application.name=tracker-server

spring.datasource.url=${TIDB_URL}
spring.datasource.username=${TIDB_USER}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRE:86400000}

server.address=0.0.0.0
server.port=${PORT:10000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Schema changes are small and indexed. No data-repair scheduler runs during live traffic.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.connect-retries=${DB_CONNECT_RETRIES:3}
spring.flyway.connect-retries-interval=${DB_CONNECT_RETRY_INTERVAL:2s}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:300000}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.data-source-properties.connectTimeout=${DB_DRIVER_CONNECT_TIMEOUT_MS:30000}
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_DRIVER_SOCKET_TIMEOUT_MS:30000}

tracker.legacy-recovery.enabled=false
tracker.agent.offline-after-seconds=${AGENT_OFFLINE_AFTER_SECONDS:45}
tracker.agent.presence-check-ms=${AGENT_PRESENCE_CHECK_MS:15000}
tracker.agent.presence-batch-size=${AGENT_PRESENCE_BATCH_SIZE:100}

tracker.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
tracker.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USERNAME:}
tracker.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
spring.flyway.ignore-migration-patterns=*:missing

tracker.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://tracker-admin-two.vercel.app}
