spring.application.name=tracker-server

spring.datasource.url=${TIDB_URL}
spring.datasource.username=${TIDB_USER}
spring.datasource.password=${TIDB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRE:86400000}

# 1. Tell Spring Boot to load your .env file safely
#spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}

# Flyway owns the schema. Hibernate verifies mappings but never mutates production.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
tracker.legacy-recovery.enabled=false
tracker.agent.offline-after-seconds=${AGENT_OFFLINE_AFTER_SECONDS:45}
tracker.agent.presence-check-ms=${AGENT_PRESENCE_CHECK_MS:10000}
tracker.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USERNAME:}
tracker.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
tracker.agent.orphan-repair-ms=${AGENT_ORPHAN_REPAIR_MS:60000}
tracker.agent.duplicate-repair-ms=${AGENT_DUPLICATE_REPAIR_MS:300000}
tracker.agent.duplicate-repair-initial-ms=${AGENT_DUPLICATE_REPAIR_INITIAL_MS:60000}

# Live duplicate repair is intentionally disabled. Flyway constraints prevent new duplicates.
tracker.agent.duplicate-repair-enabled=${AGENT_DUPLICATE_REPAIR_ENABLED:false}
tracker.agent.presence-batch-size=${AGENT_PRESENCE_BATCH_SIZE:50}

# Bounded pool/back-pressure settings. Fast transactions are preferred over a large blocked pool.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:300000}
